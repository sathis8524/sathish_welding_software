<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - VMK Welding</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #0b132b, #1c2541, #3a506b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-custom {
            background: rgba(15, 23, 42, 0.90);
            backdrop-filter: blur(15px);
            border: 2px solid #eab308;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.3);
            color: #ffffff;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            border-bottom: 2px solid #eab308;
            border-top-left-radius: 14px !important;
            border-top-right-radius: 14px !important;
        }
        .form-control-custom {
            background-color: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .form-control-custom:focus {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: #eab308;
            color: #fff;
            box-shadow: 0 0 8px rgba(234, 179, 8, 0.5);
        }
        .form-control-custom::placeholder {
            color: #94a3b8;
        }
        .btn-custom {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #0f172a;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            background: linear-gradient(135deg, #ca8a04, #eab308);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.5);
        }
        .btn-back-bottom {
            background: rgba(255, 255, 255, 0.05);
            color: #eab308;
            border: 1px solid #eab308;
            border-radius: 8px;
            padding: 8px 16px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-back-bottom:hover {
            background: #eab308;
            color: #0f172a;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.4);
        }
    </style>
</head>
<body>
<div class="container my-4" style="max-width: 440px;">
    <div class="card card-custom p-1">
        <div class="card-header card-header-custom text-white text-center py-3">
            <h4 class="mb-0 fw-bold text-warning"><i class="bi bi-key-fill me-2"></i>பாஸ்வேர்ட் மாற்றுதல்</h4>
        </div>
        <div class="card-body p-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="{{ url_for('forgot_password') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-light">பதிவு செய்த ஈமெயில் / மொபைல்</label>
                    <input type="text" name="user_input" class="form-control form-control-custom form-control-lg fs-6" placeholder="Email or Mobile" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold text-light">புதிய பாஸ்வேர்ட் (New Password)</label>
                    <input type="password" name="new_password" class="form-control form-control-custom form-control-lg fs-6" placeholder="Enter New Password" required>
                </div>
                <button type="submit" class="btn btn-custom w-100 py-2 fw-bold fs-5 mt-2">பாஸ்வேர்ட் சேஞ்ச் செய்</button>
            </form>

            <hr class="my-4 border-secondary">

            <!-- Back Button at the Bottom -->
            <div class="text-center">
                <a href="{{ url_for('login') }}" class="btn-back-bottom w-100">
                    <i class="bi bi-arrow-left-circle-fill"></i> திரும்ப லாகின் பக்கத்திற்குச் செல்ல
                </a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
