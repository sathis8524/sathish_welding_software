<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roofing Management System</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
        }
        .navbar {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .nav-brand {
            font-size: 1.2em;
            font-weight: bold;
            color: #38bdf8;
            text-decoration: none;
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .btn-back {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
            transition: 0.3s;
        }
        .btn-back:hover {
            background: #38bdf8;
            color: #0f172a;
        }
        .btn-logout {
            background: #ef4444;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85em;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="{{ url_for('home') }}" class="nav-brand">🏗️ VMK Fabrication App</a>

        <div class="nav-actions">
            {% if session.get('logged_in') %}
                {% if request.endpoint != 'dashboard' %}
                    <a href="{{ url_for('dashboard') }}" class="btn-back">🔙 Back to Dashboard</a>
                {% endif %}
                <a href="{{ url_for('logout') }}" class="btn-logout">Logout</a>
            {% else %}
                <a href="{{ url_for('login') }}" class="btn-back">Login</a>
            {% endif %}
        </div>
    </nav>

    {% block content %}
    {% endblock %}

</body>
</html>
