<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>பதிவு செய்க (Register) - VMK Welding</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #0b132b, #1c2541, #3a506b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-custom {
            background: rgba(15, 23, 42, 0.90);
            backdrop-filter: blur(15px);
            border: 2px solid #38bdf8;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
            color: #ffffff;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            border-bottom: 2px solid #38bdf8;
            border-top-left-radius: 14px !important;
            border-top-right-radius: 14px !important;
        }
        .form-control-custom {
            background-color: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .form-control-custom:focus {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: #38bdf8;
            color: #fff;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
        }
        .form-control-custom::placeholder {
            color: #94a3b8;
        }
        .btn-custom {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0f172a;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }
        .btn-back-bottom {
            background: rgba(255, 255, 255, 0.05);
            color: #38bdf8;
            border: 1px solid #38bdf8;
            border-radius: 8px;
            padding: 8px 16px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-back-bottom:hover {
            background: #38bdf8;
            color: #0f172a;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>
<div class="container my-4" style="max-width: 480px;">
    <div class="card card-custom p-1">
        <div class="card-header card-header-custom text-white text-center py-3">
            <h4 class="mb-0 fw-bold text-info"><i class="bi bi-person-plus-fill me-2"></i>புதிய கணக்கு உருவாக்கு</h4>
        </div>
        <div class="card-body p-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="{{ url_for('register') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-light">பெயர் (Full Name)</label>
                    <input type="text" name="full_name" class="form-control form-control-custom form-control-lg fs-6" placeholder="உங்கள் பெயர்" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold text-light">ஈமெயில் ஐடி (Email ID)</label>
                    <input type="email" name="email" class="form-control form-control-custom form-control-lg fs-6" placeholder="example@gmail.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold text-light">மொபைல் எண் (Mobile Number)</label>
                    <input type="tel" name="mobile" pattern="[0-9]{10}" class="form-control form-control-custom form-control-lg fs-6" placeholder="10 இலக்க மொபைல் எண்" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold text-light">பாஸ்வேர்ட் (Password)</label>
                    <input type="password" name="password" class="form-control form-control-custom form-control-lg fs-6" placeholder="பாஸ்வேர்ட் உருவாக்கவும்" required>
                </div>
                <button type="submit" class="btn btn-custom w-100 py-2 fw-bold fs-5 mt-2">பதிவு செய் (Register)</button>
            </form>

            <hr class="my-4 border-secondary">

            <p class="text-center mb-3 text-light">ஏற்கனவே கணக்கு உள்ளதா? <a href="{{ url_for('login') }}" class="fw-bold text-info text-decoration-none">லாகின் செய்ய</a></p>

            <!-- Back Button at the Bottom -->
            <div class="text-center pt-2">
                <a href="{{ url_for('home') }}" class="btn-back-bottom w-100">
                    <i class="bi bi-house-door-fill"></i> முகப்பு பக்கத்திற்கு செல்ல (Back to Home)
                </a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
